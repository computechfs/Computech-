<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! | CompuTech FS</title>
    <meta name="robots" content="noindex">

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: #0a1317;
            color: #e4eef0;
            font-family: 'IBM Plex Sans', sans-serif;
            text-align: center;
        }
        img { width: 72px; margin: 0 auto 1.5rem; display: block; }
        h1 { font-family: 'Chakra Petch', sans-serif; font-size: 2.4rem; margin: 0 0 0.8rem; }
        p { color: #8fa7ad; max-width: 440px; margin: 0 auto 2rem; line-height: 1.6; }
        a {
            display: inline-block;
            padding: 0.9rem 1.5rem;
            border-radius: 10px;
            background: #3cc8d6;
            color: #04262a;
            font-weight: 600;
            text-decoration: none;
        }
        a:hover { background: #8ae6ee; }
    </style>
</head>
<body>
    <main>
        <img src="/logo.png" alt="CompuTech FS">
        <h1>¡Gracias por tu consulta!</h1>
        <p>La recibimos correctamente y te vamos a contactar a la brevedad. Si es urgente, escribinos por WhatsApp.</p>
        <a href="/">Volver al inicio</a>

</html>
